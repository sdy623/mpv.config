name: Build plugin configuration
on:
  push:
    branches: [anime-bd-plugins]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          RELEASE_VERSION: v1.9.19-anime-bd.1
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-configurations
          path: dist/*.zip
